name: Deploy User Domain to EC2

on:
  push:
    branches:
      - QA 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    
    - name: Set up SSH key for EC2
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.EC2_PEM_KEY }}

    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Build Docker images services
      run: |
        docker build -t chamorrito/change_password ./change_password
        docker build -t chamorrito/delete-account ./delete_account
        docker build -t chamorrito/phrases ./water_store_service


    - name: Push images to Docker Hub
      run: |
        docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
        docker push chamorrito/change_password
        docker push chamorrito/delete-account
        docker push chamorrito/phrases

    - name: Deploy services to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: 50.19.246.209
        username: ec2-user
        key: ${{ secrets.EC2_PEM_KEY }}
        script: |
          # Docker
          docker stop change_password || true
          docker rm change_password || true
          docker stop delete-account || true
          docker rm delete-account || true
          docker stop phrases || true
          docker rm phrases || true


          # D
          docker pull chamorrito/change_password
          docker pull chamorrito/delete-account
          docker pull chamorrito/phrases

          # E
          docker run -d --name change_password -p 4567:4567 --restart unless-stopped chamorrito/change_password
          docker run -d --name delete-account -p 4569:4569 --restart unless-stopped chamorrito/delete-account
          docker run -d --name phrases -p 5000:5000 --restart unless-stopped chamorrito/phrases
